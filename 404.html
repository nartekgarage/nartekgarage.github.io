<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>404 | Nartek Garage</title>

  <style>
    :root{
      --bg:#07090c;
      --panel:#0e1218;
      --text:#f4f7fb;
      --muted:#8e99a8;
      --blue:#168cff;
      --blue2:#55b0ff;
      --line:rgba(255,255,255,.09);
    }

    *{box-sizing:border-box;margin:0;padding:0}

    html,body{min-height:100%}

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px 20px;
      font-family:Inter,Segoe UI,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 75% 20%,rgba(22,140,255,.14),transparent 30%),
        radial-gradient(circle at 15% 75%,rgba(22,140,255,.07),transparent 28%),
        var(--bg);
    }

    .wrap{
      width:min(760px,100%);
      text-align:center;
      position:relative;
    }

    .brand{
      font-size:18px;
      font-weight:900;
      letter-spacing:2px;
      margin-bottom:44px;
    }

    .brand span{color:var(--blue)}

    .error-code{
      font-size:clamp(110px,22vw,210px);
      line-height:.8;
      font-weight:1000;
      letter-spacing:-10px;
      color:transparent;
      -webkit-text-stroke:2px rgba(85,176,255,.85);
      text-shadow:0 0 45px rgba(22,140,255,.12);
      margin-bottom:34px;
    }

    .kicker{
      color:var(--blue2);
      font-size:12px;
      font-weight:900;
      letter-spacing:3px;
      text-transform:uppercase;
      margin-bottom:12px;
    }

    h1{
      font-size:clamp(34px,6vw,54px);
      line-height:1.05;
      margin-bottom:16px;
    }

    p{
      max-width:560px;
      margin:0 auto;
      color:var(--muted);
      font-size:17px;
      line-height:1.7;
    }

    .actions{
      margin-top:34px;
      display:flex;
      justify-content:center;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:50px;
      padding:14px 22px;
      border-radius:8px;
      background:var(--blue);
      border:1px solid var(--blue);
      color:#fff;
      text-decoration:none;
      font-weight:900;
      transition:.25s;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }

    .btn:hover{
      transform:translateY(-2px);
      box-shadow:0 12px 35px rgba(22,140,255,.25);
    }

    .line{
      width:80px;
      height:2px;
      margin:42px auto 0;
      background:linear-gradient(90deg,transparent,var(--blue),transparent);
      opacity:.8;
    }

    @media(max-width:520px){
      body{padding:24px 18px}
      .brand{margin-bottom:38px}
      .error-code{
        letter-spacing:-6px;
        margin-bottom:28px;
      }
      p{font-size:15px}
      .btn{width:100%;max-width:290px}
    }
  </style>
</head>

<body>
  <main class="wrap">
    <div class="brand">NARTEK <span>GARAGE</span></div>

    <div class="error-code">404</div>

    <div class="kicker">Pagina nu a fost găsită</div>

    <h1>Ai ajuns într-o zonă a garajului care nu există</h1>

    <p>
      Linkul accesat nu mai există sau adresa a fost introdusă greșit.
      Poți reveni oricând la pagina principală Nartek Garage.
    </p>

    <div class="actions">
      <a class="btn" href="/">← Înapoi acasă</a>
    </div>

    <div class="line"></div>
  </main>
</body>
</html>
